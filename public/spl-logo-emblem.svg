<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" fill="none">
  <defs>
    <linearGradient id="splGoldMain" x1="40" y1="24" x2="320" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="splGoldSoft" x1="80" y1="40" x2="280" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="splCrimson" x1="60" y1="90" x2="290" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="splObsidian" x1="180" y1="32" x2="180" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111622" />
      <stop offset="100%" stop-color="#05060A" />
