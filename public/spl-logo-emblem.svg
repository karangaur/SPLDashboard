  <path d="M142 94L162 158H198L218 94L200 100L190 90L180 102L170 90L160 100L142 94Z" fill="url(#splPlatinum)" />
  <path d="M158 100L168 154M180 102V154M202 100L192 154" stroke="#090D16" stroke-width="2.5" stroke-linecap="round" />
  <rect x="160" y="156" width="40" height="8" rx="3" fill="url(#splCrimson)" />
  <path d="M164 166H196V173C196 182 189 189 180 189C171 189 164 182 164 173V166Z" fill="url(#splGoldMain)" />

  <!-- Bold Angular Geometric SPL Lettermark -->
  <g transform="translate(0, 6)">
    <!-- S -->
    <path
      d="M138 198H102L94 212V226L104 232H128L124 242H92L86 254H132L140 240V224L130 218H107L111 210H134L138 198Z"
