  <!-- Dynamic High-Speed Motion Wings (Electric Crimson / Fiery Orange) -->
  <path d="M26 116L94 128L82 146L34 134L26 116Z" fill="url(#splCrimson)" />
  <path d="M40 154L98 158L90 174L48 170L40 154Z" fill="url(#splGoldSoft)" />
  <path d="M334 116L266 128L278 146L326 134L334 116Z" fill="url(#splCrimson)" />
  <path d="M320 154L262 158L270 174L312 170L320 154Z" fill="url(#splGoldSoft)" />

