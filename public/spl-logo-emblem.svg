    <linearGradient id="splPlatinum" x1="110" y1="80" x2="250" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <!-- Outer Geometric Championship Crest -->
  <path
    d="M180 20L308 66L288 214C281 268 238 312 180 338C122 312 79 268 72 214L52 66L180 20Z"
