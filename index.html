    <script>
      // Suppress WebSocket/HMR connection errors in iframe and proxy environments per platform guidelines
      (function () {
        function isHmrError(err) {
          if (!err) return false;
          var msg = String(err.message || err.reason || err || '');
          var stack = String(err.stack || '');
          return (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('vite:ws') !== -1 ||
            stack.indexOf('@vite/client') !== -1 ||
            stack.indexOf('WebSocket') !== -1
          );
        }
        window.addEventListener('unhandledrejection', function (e) {
          if (isHmrError(e.reason)) {
            e.preventDefault();
            if (typeof e.stopImmediatePropagation === 'function') {
              e.stopImmediatePropagation();
            }
          }
        });
        window.addEventListener('error', function (e) {
          if (
            isHmrError(e.error) ||
            (e.message && e.message.indexOf('WebSocket') !== -1) ||
            (e.filename && e.filename.indexOf('@vite/client') !== -1)
          ) {
            e.preventDefault();
            if (typeof e.stopImmediatePropagation === 'function') {
              e.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
